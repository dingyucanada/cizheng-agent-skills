<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="485" viewBox="0 0 1120 485" role="img" aria-labelledby="title desc"><title id="title">实物研究、反证与修订流程</title><desc id="desc">本地研究读取多视角照片与固定正文，提出分项意见。获批文字由StepFun提出反证问题，本地模型回查并保留修订、未解决事项与原版。引用身份检查和原件导出与专业复核分工。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#638398"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#638398" stroke-opacity=".09"/></pattern></defs><rect width="1120" height="485" fill="#f6f5ef"/><rect width="1120" height="485" fill="url(#grid)"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b40}.muted{fill:#607784}.gold{fill:#ceb279}.white{fill:#fff}.small{font-size:13px}.body{font-size:16px}.title{font-size:22px;font-weight:600}.tiny{font-size:11px;letter-spacing:1px}</style><text x="45" y="42" class="tiny">实际研究 / 多模型分工与有理由的修订</text><text x="45" y="78" class="title">每一次修订，都能回到当时的依据</text><rect x="45" y="123" width="185" height="199" rx="7" fill="#fff" stroke="#cbd6db"/><text x="61" y="152" class="tiny">01</text><text x="61" y="184" class="body">实物与资料</text><text x="61" y="226" class="small">整图 + 区域像素</text><text x="61" y="256" class="small">按需读取方法包</text><text x="61" y="286" class="small">成功阅读固定正文</text><path d="M232 221 L249 221" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="252" y="123" width="185" height="199" rx="7" fill="#fff" stroke="#cbd6db"/><text x="268" y="152" class="tiny">02</text><text x="268" y="184" class="body">分项初稿</text><text x="268" y="226" class="small">观察与解释分开</text><text x="268" y="256" class="small">时期 / 窑口 / 风格</text><text x="268" y="286" class="small">理由与限制留在案卷</text><path d="M439 221 L456 221" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="459" y="123" width="185" height="199" rx="7" fill="#fff" stroke="#cbd6db"/><text x="475" y="152" class="tiny">03</text><text x="475" y="184" class="body">文字反证</text><text x="475" y="226" class="small">批准后送 StepFun</text><text x="475" y="256" class="small">提出具体核查问题</text><text x="475" y="286" class="small">不发送实物原图</text><path d="M646 221 L663 221" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="666" y="123" width="185" height="199" rx="7" fill="#fff" stroke="#cbd6db"/><text x="682" y="152" class="tiny">04</text><text x="682" y="184" class="body">本地再研究</text><text x="682" y="226" class="small">回查相关材料</text><text x="682" y="256" class="small">逐项回应与补证</text><text x="682" y="286" class="small">原版和未决项保留</text><path d="M853 221 L870 221" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="873" y="123" width="185" height="199" rx="7" fill="#fff" stroke="#cbd6db"/><text x="889" y="152" class="tiny">05</text><text x="889" y="184" class="body">专业交接</text><text x="889" y="226" class="small">引用身份核对</text><text x="889" y="256" class="small">报告与原件导出</text><text x="889" y="286" class="small">人工复核与版本交接</text><rect x="45" y="355" width="1030" height="81" rx="7" fill="#142b40" stroke="#142b40"/><text x="65" y="386" class="white">Agent 决定研究路径与下一项材料；工具保存原件、定位、权限、阅读回执和版本。</text><text x="65" y="414" class="white">一个来源身份核对通过，并不自动使所有归属解释成立；疑点以可继续工作的事项交接。</text><text x="45" y="466" class="small">图示对应已保存的实物研究流程；原始模型意见、审查问题和修订理由可逐项回查。</text></svg>