<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="730" viewBox="0 0 1120 730" role="img" aria-labelledby="title desc"><title id="title">桌面陶瓷采集箱设计概念</title><desc id="desc">面向博物馆的桌面采集箱研究设计，尚未制造。遮光箱、可控照明、相机、色卡和比例尺、可选底部或微距视角连接通用采集接口。可选物理传感器记录检验条件，不能单独证明真伪。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#638398"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#638398" stroke-opacity=".09"/></pattern></defs><rect width="1120" height="730" fill="#f6f5ef"/><rect width="1120" height="730" fill="url(#grid)"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b40}.muted{fill:#607784}.gold{fill:#ceb279}.white{fill:#fff}.small{font-size:13px}.body{font-size:16px}.title{font-size:22px;font-weight:600}.tiny{font-size:11px;letter-spacing:1px}</style><text x="45" y="42" class="tiny">装置研究 / 博物馆桌面采集台</text><text x="45" y="78" class="title">一次规范采集，留下可比较的实物记录</text><text x="845" y="77" class="small">设计概念 · 尚未制造</text><path d="M320 147 L708 113 L823 185 L430 226 Z" fill="#d4dfe1" stroke="#8198a5" stroke-width="2"/><path d="M320 147 L430 226 L430 579 L320 481 Z" fill="#284d66" stroke="#8198a5" stroke-width="2"/><path d="M430 226 L823 185 L823 534 L430 579 Z" fill="#10283c" stroke="#8198a5" stroke-width="2"/><path d="M451 250 L801 214 L801 516 L451 552 Z" fill="#233e50" stroke="#73909f"/><path d="M460 514 L784 484 L798 516 L451 552 Z" fill="#b9c7c7"/><ellipse cx="629" cy="488" rx="93" ry="24" fill="#9cafb4" stroke="#587886"/><path d="M606 294 Q623 288 641 291 L645 315 Q632 337 640 365 Q686 406 659 470 Q632 483 603 469 Q575 411 614 366 Q620 343 600 317 Z" fill="#eef1e8" stroke="#9cbbc3" stroke-width="2"/><path d="M613 357 Q647 363 651 383 M597 405 Q632 389 669 424 M603 443 Q632 430 658 450" fill="none" stroke="#456b90" stroke-width="5"/><path d="M604 308 L642 306" stroke="#456b90" stroke-width="5"/><path d="M474 267 L487 266 L487 498 L474 499 Z M766 235 L779 234 L779 466 L766 467 Z" fill="#d9c18d"/><rect x="603" y="237" width="46" height="26" rx="5" fill="#8aa8b6"/><circle cx="627" cy="251" r="8" fill="#142b40"/><path d="M568 497 L568 482 L581 481 L581 496 Z" fill="#fff"/><path d="M584 496 L584 481 L597 480 L597 495 Z" fill="#b44943"/><path d="M600 495 L600 480 L613 479 L613 494 Z" fill="#476b91"/><rect x="45" y="136" width="245" height="127" rx="7" fill="#fff" stroke="#cbd6db"/><text x="62" y="166" class="body">01  受控光线</text><text x="62" y="193" class="small">遮光环境 / 固定曝光</text><text x="62" y="216" class="small">可标定可见光 / 偏振照明</text><text x="62" y="239" class="small">减少眩光，保留拍摄条件</text><path d="M290 202 L463 267" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="297" width="245" height="127" rx="7" fill="#fff" stroke="#cbd6db"/><text x="62" y="327" class="body">02  多视角与局部</text><text x="62" y="354" class="small">主视 / 侧视 / 口沿 / 足底</text><text x="62" y="377" class="small">相机与微距模块选择</text><text x="62" y="400" class="small">安全托台，人操作放置器物</text><path d="M290 361 L598 394" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="858" y="136" width="217" height="127" rx="7" fill="#fff" stroke="#cbd6db"/><text x="875" y="167" class="body">03  采集标定</text><text x="875" y="194" class="small">色卡与比例尺</text><text x="875" y="217" class="small">器物编号 / 采集批次</text><text x="875" y="240" class="small">图像原件与设备元数据</text><path d="M858 220 L701 494" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="858" y="297" width="217" height="150" rx="7" fill="#fff" stroke="#cbd6db"/><text x="875" y="327" class="body">04  可选检查模块</text><text x="875" y="354" class="small">UV / IR 或其他检测记录</text><text x="875" y="377" class="small">保存单位、条件与原数据</text><text x="875" y="400" class="small">需专业设备与专家解释</text><text x="875" y="423" class="small">照片不替代物理检验</text><path d="M858 379 L802 418" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="609" width="1030" height="74" rx="7" fill="#142b40" stroke="#142b40"/><text x="66" y="639" class="white">通用采集接口 → 绑定案卷、权限、原图 SHA256、视角与传感器单位 → 专家复核</text><text x="66" y="665" class="white">先完成软件采集桥接，后进行装置标定与设备适配；未宣称已对接品牌 SDK 或已进行 XRF / 热释光检测。</text><text x="45" y="710" class="small">非侵入性采集优先；照明与检测条件须由机构文保流程审核，联合设计后再进入制造验证。</text></svg>