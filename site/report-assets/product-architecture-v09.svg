<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">瓷证专业研究与计算架构</title><desc id="desc">器物照片通过网页或授权采集桥接进入案卷。Spark本地视觉与Skills逐项研究并读取固定RAG资料。引用身份核查和人工复核后交付，批准文字可送StepFun反证审查。独立TensorRT-LLM与GPU检索服务已部署，NIM原厂独立文字接口已部署。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#638398"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#638398" stroke-opacity=".09"/></pattern></defs><rect width="1120" height="760" fill="#f6f5ef"/><rect width="1120" height="760" fill="url(#grid)"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b40}.muted{fill:#607784}.gold{fill:#ceb279}.white{fill:#fff}.small{font-size:13px}.body{font-size:16px}.title{font-size:22px;font-weight:600}.tiny{font-size:11px;letter-spacing:1px}</style><text x="45" y="42" class="tiny">瓷证 / 从实物采集到专业交接</text><text x="45" y="78" class="title">把照片变成可以交接的专业研究案卷</text><rect x="45" y="112" width="230" height="160" rx="7" fill="#fff" stroke="#cbd6db"/><text x="65" y="146" class="title">01  材料采集</text><text x="65" y="180" class="body">网页 / 手机 / 设备桥接</text><text x="65" y="206" class="body">原图、视角、器物登记</text><text x="65" y="232" class="body">附件与现场检查记录</text><text x="65" y="253" class="small">设备厂商 SDK 与采集箱为后续适配</text><rect x="323" y="112" width="752" height="414" rx="7" fill="#edf1f1" stroke="#cbd6db"/><text x="344" y="145" class="tiny">DGX Spark · 机构内的私有研究节点</text><text x="344" y="177" class="title">02  材料留在本地，按方法研究</text><rect x="344" y="200" width="333" height="138" rx="7" fill="#fff" stroke="#cbd6db"/><text x="366" y="231" class="body">Qwen3-VL-8B / CUDA</text><text x="366" y="257" class="body">整图 + 有坐标的区域观察</text><text x="366" y="283" class="body">Agent 按需读取 7 个领域 Skills</text><text x="366" y="309" class="body">工具预算、读取回执、版本约束</text><rect x="701" y="200" width="352" height="138" rx="7" fill="#fff" stroke="#cbd6db"/><text x="722" y="231" class="body">固定版本 RAG + 原件仓</text><text x="722" y="257" class="body">资料段落、权限、SHA256</text><text x="722" y="283" class="body">SQLite 主检索与案卷事务</text><text x="722" y="309" class="body">原始输入和每一版意见独立保存</text><rect x="344" y="360" width="709" height="67" rx="7" fill="#142b40" stroke="#142b40"/><text x="365" y="388" class="white">03  矛盾筛查 → 证据核对 → 研究报告</text><text x="365" y="412" class="white">NAT 引用身份检查 / 补证修订 / 人工复核 / 案卷导出</text><rect x="344" y="448" width="224" height="55" rx="7" fill="#fff" stroke="#cbd6db"/><text x="358" y="470" class="small">TensorRT-LLM 文字服务</text><text x="358" y="491" class="small">独立接口已部署 · 8006</text><rect x="582" y="448" width="226" height="55" rx="7" fill="#fff" stroke="#cbd6db"/><text x="596" y="470" class="small">NVIDIA Embedding + cuVS</text><text x="596" y="491" class="small">独立 GPU 检索 · 8003</text><rect x="822" y="448" width="231" height="55" rx="7" fill="#fff" stroke="#cbd6db"/><text x="836" y="470" class="small">NIM 标准模型服务</text><text x="836" y="491" class="small">独立文字接口已部署 · 8007</text><path d="M275 195 L320 195" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><path d="M684 269 L699 269" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><path d="M693 340 L693 357" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="307" width="230" height="219" rx="7" fill="#fff" stroke="#cbd6db"/><text x="65" y="343" class="title">04  专业交接</text><text x="65" y="378" class="body">研究意见与逐项理由</text><text x="65" y="404" class="body">支持、矛盾及补拍建议</text><text x="65" y="430" class="body">原图区域 / 资料定位</text><text x="65" y="456" class="body">复核备注与版本比较</text><text x="65" y="482" class="body">JSON / HTML / 原件包</text><path d="M323 394 L278 394" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="561" width="1030" height="111" rx="7" fill="#eae5d7" stroke="#cbd6db"/><text x="65" y="593" class="tiny">可选文字协作 / 有范围的反证审查</text><text x="65" y="624" class="body">StepFun · step-3.7-flash：只接收获批公开或脱敏文字</text><text x="65" y="650" class="small">审查者提出疑点；本地研究者回查证据并修订。原图、私有附件与密钥不进入公开体验页。</text><text x="45" y="709" class="small">主流程与独立服务分开核验；新增推理引擎和向量排名不自动授予引用许可。</text><text x="45" y="734" class="small">公开教学体验：预置馆藏材料、本浏览器操作与导出；不调用私有模型。</text></svg>