<rect x="358" y="330" width="220" height="143" fill="#fff" stroke="#cad7df"/><text class="h" x="376" y="359">本地视觉</text><text class="b" x="376" y="387">Qwen3-VL-8B 基线</text><text class="b" x="376" y="411">PyTorch / CUDA / BF16</text><text class="s" x="376" y="450">真实双图 / 原请求 Schema 校验</text>
<rect x="599" y="330" width="220" height="143" fill="#fff" stroke="#cad7df"/><text class="h" x="617" y="359">方法与资料</text><text class="b" x="617" y="387">7 Skills · 按需正文与资源</text><text class="b" x="617" y="411">固定版本段落 / SQLite 检索</text><text class="s" x="617" y="450">意见与引用由模型自主选择</text>
<rect x="840" y="330" width="220" height="143" fill="#fff" stroke="#cad7df"/><text class="h" x="858" y="359">案卷与原件</text><text class="b" x="858" y="387">SQLite / 原始文件 / SHA256</text><text class="b" x="858" y="411">版本、观察、审查与导出</text><text class="s" x="858" y="450">原图留在服务所在本机</text><text class="s" x="358" y="501">后端在笔记本时，笔记本也保存原图；本地图像处理与文字外发许可分别确认。</text>
