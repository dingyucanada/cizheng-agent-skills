<svg xmlns="http://www.w3.org/2000/svg" style="fill:#142b40" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc"><title id="title">瓷证系统与原图、文字边界</title><desc id="desc">第12轮基线：公开教学只在浏览器运行；专业案卷服务在指定本机连接视觉服务、七个Skills、SQLite固定资料和原件存储；NAT核查引用身份，本地修订并导出。StepFun只接收批准四字段文字，不发送原图。新增部署另据实际状态更新。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8197a7"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.k{font-size:10px;letter-spacing:1.4px;fill:#6d8292}.h{font-size:18px;font-weight:600}.b{font-size:12px;fill:#5d6f7c}.s{font-size:11px;fill:#637789}.a{fill:none;stroke:#8197a7;stroke-width:1.8;marker-end:url(#arrow)}.d{fill:none;stroke:#ab9465;stroke-width:1.8;stroke-dasharray:5 5;marker-end:url(#arrow)}</style></defs><rect width="1120" height="690" fill="#fff"/><text class="k" x="38" y="35">SYSTEM / 第12轮实现基线 · 新部署独立核验</text>
<rect x="38" y="58" width="1044" height="89" rx="2" fill="#eef1eb" stroke="#d6ddd4"/><text class="h" x="60" y="92">公开教学体验</text><text class="b" x="60" y="119">浏览器编辑预置案卷 · 不上传 · 不调用模型</text><text class="s" x="713" y="100">独立于专业服务与真实 AI 案件</text>
<rect x="38" y="187" width="220" height="103" fill="#faf8f2" stroke="#c6d1d8"/><text class="k" x="58" y="215">INPUT / 原始材料</text><text class="h" x="58" y="242">器物与研究问题</text><text class="b" x="58" y="268">原图 / 附件 / 许可 / 案件</text><path class="a" d="M258 239H335"/>
<rect x="335" y="175" width="747" height="350" fill="#edf2f3" stroke="#95adbd"/><text class="k" x="358" y="203">PRIVATE SERVICE / 指定本机 · DGX SPARK</text><rect x="358" y="224" width="702" height="72" fill="#142b40"/><text x="380" y="254" fill="#fff" font-size="19" font-weight="600">案卷服务 · 受约束 Agent Harness</text><text x="380" y="279" fill="#c4d2dc" font-size="12">版本 / 权限 / 预算 / 成功读取回执 / 工具合同 / 失败保留</text>
