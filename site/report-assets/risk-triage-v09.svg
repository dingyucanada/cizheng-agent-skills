<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc"><title id="title">六维矛盾筛查与复核优先指数</title><desc id="desc">六个固定评价维度按可核对事实生成理由。未知项单列，不当作无风险。复核优先指数用于工作排序，不表示真品概率。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#638398"/></marker><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#638398" stroke-opacity=".09"/></pattern></defs><rect width="1120" height="680" fill="#f6f5ef"/><rect width="1120" height="680" fill="url(#grid)"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#142b40}.muted{fill:#607784}.gold{fill:#ceb279}.white{fill:#fff}.small{font-size:13px}.body{font-size:16px}.title{font-size:22px;font-weight:600}.tiny{font-size:11px;letter-spacing:1px}</style><text x="45" y="42" class="tiny">六维矛盾筛查 / 每个提示都有理由</text><text x="45" y="78" class="title">先找到哪里互相矛盾，再决定下一步</text><rect x="45" y="112" width="329" height="112" rx="7" fill="#fff" stroke="#cbd6db"/><text x="63" y="139" class="tiny">01</text><text x="97" y="140" class="body">制作时期 · 20</text><text x="63" y="174" class="small">时期区间 / 相应观察与出处</text><text x="63" y="200" class="small">相符 / 矛盾 / 未知 → 可回查理由</text><rect x="394" y="112" width="329" height="112" rx="7" fill="#fff" stroke="#cbd6db"/><text x="412" y="139" class="tiny">02</text><text x="446" y="140" class="body">窑口归属 · 15</text><text x="412" y="174" class="small">本案报告与实际观察依据</text><text x="412" y="200" class="small">相符 / 矛盾 / 未知 → 可回查理由</text><rect x="743" y="112" width="329" height="112" rx="7" fill="#fff" stroke="#cbd6db"/><text x="761" y="139" class="tiny">03</text><text x="795" y="140" class="body">装饰风格 · 15</text><text x="761" y="174" class="small">纹饰观察与推断支持关系</text><text x="761" y="200" class="small">相符 / 矛盾 / 未知 → 可回查理由</text><rect x="45" y="245" width="329" height="112" rx="7" fill="#fff" stroke="#cbd6db"/><text x="63" y="272" class="tiny">04</text><text x="97" y="273" class="body">来源对应 · 20</text><text x="63" y="307" class="small">同编号身份 / 来源事件先后</text><text x="63" y="333" class="small">相符 / 矛盾 / 未知 → 可回查理由</text><rect x="394" y="245" width="329" height="112" rx="7" fill="#fff" stroke="#cbd6db"/><text x="412" y="272" class="tiny">05</text><text x="446" y="273" class="body">状况与修复 · 15</text><text x="412" y="307" class="small">状况记录 / 实际检查条件</text><text x="412" y="333" class="small">相符 / 矛盾 / 未知 → 可回查理由</text><rect x="743" y="245" width="329" height="112" rx="7" fill="#fff" stroke="#cbd6db"/><text x="761" y="272" class="tiny">06</text><text x="795" y="273" class="body">采集完整性 · 15</text><text x="761" y="307" class="small">视角缺口 / 测量记载一致性</text><text x="761" y="333" class="small">相符 / 矛盾 / 未知 → 可回查理由</text><path d="M556 365 L556 395" fill="none" stroke="#638398" stroke-width="2" marker-end="url(#arrow)"/><rect x="220" y="402" width="680" height="88" rx="7" fill="#142b40" stroke="#142b40"/><text x="245" y="435" class="white">复核优先指数 0–100</text><text x="245" y="465" class="white">冲突权重 + ½ 未知权重；同时显示已评覆盖与未评项</text><rect x="45" y="531" width="329" height="97" rx="7" fill="#fff" stroke="#cbd6db"/><text x="63" y="558" class="body">明确矛盾</text><text x="63" y="584" class="body">优先人工复核 / 暂缓确定性措辞</text><text x="63" y="610" class="body">回查冲突的两份记录</text><rect x="395" y="531" width="329" height="97" rx="7" fill="#fff" stroke="#cbd6db"/><text x="413" y="558" class="body">材料不齐</text><text x="413" y="584" class="body">提出具体补拍与补证清单</text><text x="413" y="610" class="body">未知不计作相符</text><rect x="745" y="531" width="329" height="97" rx="7" fill="#fff" stroke="#cbd6db"/><text x="763" y="558" class="body">材料可继续研究</text><text x="763" y="584" class="body">进入逐图观察与证据比较</text><text x="763" y="610" class="body">低指数不是“真品认证”</text><text x="45" y="657" class="small">数值定位：工作排序指数；真实鉴定概率需要专家真值、代表性样本及独立校准。</text></svg>