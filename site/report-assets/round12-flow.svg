<svg xmlns="http://www.w3.org/2000/svg" style="fill:#142b40" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc"><title id="title">第12轮实际工作流</title><desc id="desc">已知同器双图和固定正文进入初稿，6次模型13次工具133.966秒；本地预览批准四字段文字，StepFun一次10.635秒；本地修订8次模型16次工具142.183秒；两版各一段正文一条来源上下文引用，NAT verified，6份导出SHA通过。技术完成，专业质量false，三项疑点未解决。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8197a7"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif}.k{font-size:10px;letter-spacing:1px;fill:#6b8190}.h{font-size:18px;font-weight:600}.b{font-size:12px;fill:#5c6e7b}.a{fill:none;stroke:#8197a7;stroke-width:1.8;marker-end:url(#arr)}</style></defs><rect width="1120" height="420" fill="#fff"/><text class="k" x="35" y="34">ACTUAL ROUND 12 / 已保存的技术流程，不是专业验收</text><rect x="35" y="66" width="205" height="190" fill="#eef2f3" stroke="#c0d0da"/><text class="k" x="53" y="94">01 / INITIAL</text><text class="h" x="53" y="127">本地视觉与初稿</text><text class="b" x="53" y="157">已知同器双图 / 固定正文</text><text class="b" x="53" y="183">6 model / 13 tool</text><text class="h" x="53" y="216" style="font-size:23px">133.966 秒</text><text class="k" x="53" y="242">随后初稿 NAT / 三格式导出</text><path class="a" d="M240 154H278"/>
