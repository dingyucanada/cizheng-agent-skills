<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">DGX Spark 最新运行拓扑与独立服务边界</title>
<desc id="desc">既有案卷主流程使用本地8B视觉、七个Skills、SQLite固定资料、NAT引用核查与批准文字StepFun。新增TensorRT-LLM文字服务和NVIDIA开放嵌入模型加cuVS检索在Spark独立部署验收，尚未切换主流程。NIM官方分发需要授权，未部署。</desc>
