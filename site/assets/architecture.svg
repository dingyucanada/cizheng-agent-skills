<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">瓷证系统架构与材料隐私边界</title>
<desc id="desc">公开教学页只在浏览器编辑和导出。专业工作台通过本地服务或SSH隧道进入指定本机或DGX Spark，原图在本地存储与Qwen3-VL-8B视觉模型处理；Agent按需读取七个Skills与固定版本RAG资料。NAT核查报告引用身份，人工复核后导出。StepFun只接收批准的公开或脱敏文字，不发送原图；真实初稿、批准文字审查、本地修订及两版导出流程已完成，Nsight GPU性能采集已运行，专业质量仍待验。32B候选通过CUDA与合成协议，但真实双图业务失败后已停止，未证明更好。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#74879a"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#142b40}.label{font-size:11px;letter-spacing:1.2px;fill:#586d7f}.head{font-size:17px;font-weight:600}.body{font-size:12px;fill:#536675}.small{font-size:11px;fill:#596b79}.arrow{fill:none;stroke:#74879a;stroke-width:1.7;marker-end:url(#arrow)}.wire{fill:none;stroke:#a48a56;stroke-width:1.7;stroke-dasharray:5 5;marker-end:url(#arrow)}</style></defs>
