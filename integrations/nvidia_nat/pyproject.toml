[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cizheng-nvidia-nat"
version = "0.1.0"
description = "Case-scoped, offline evidence tools for NVIDIA NeMo Agent Toolkit"
requires-python = ">=3.11,<3.14"
dependencies = ["nvidia-nat==1.9.0", "nvidia-nat-langchain==1.9.0", "Pillow>=10.4,<13"]

[project.optional-dependencies]
eval = ["nvidia-nat-eval==1.9.0", "nvidia-nat-profiler==1.9.0"]
test = ["pytest>=8,<10"]

[project.entry-points."nat.components"]
cizheng_evidence = "cizheng_nat.register"

[tool.setuptools.packages.find]
where = ["src"]
